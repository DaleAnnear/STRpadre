schema_version: "1.0"
caller: longtr
container: daleannear/strpadre:longtr-1.2-r1
tool_version: "1.2"
reference_build: example-build
platforms: [hifi, ont]
threads: 1
resources: { memory: 12 GB, time: 24h }
phased_reads_expected: false
additional_args: []
sex_chromosome_policy:
  enabled: true
  reference_build: GRCh38
  chromosome_x: chrX
  chromosome_y: chrY
  # 0-based, half-open GRCh38 PAR intervals. Male PAR loci remain diploid.
  pseudoautosomal_regions:
    - { chromosome: chrX, start: 10000, end: 2781479 }
    - { chromosome: chrX, start: 155701382, end: 156030895 }
    - { chromosome: chrY, start: 10000, end: 2781479 }
    - { chromosome: chrY, start: 56887902, end: 57217415 }
options:
  min_mapq: 20
  min_mean_qual: 30
  max_tr_len: 1000
  min_reads: 10
  indel_flank_len: 5
  phased_bam: false
  output_filters: true
  haploid_chromosomes: []
  # Default: treat each input sample as one library; avoids requiring @RG LB tags.
  # Set true only when every read group has a valid LB tag and library-aware calling is wanted.
  use_lb_tags: false
