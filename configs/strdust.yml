schema_version: "1.0"
caller: strdust
container: daleannear/strpadre:strdust-0.20.0
tool_version: "0.20.0"
reference_build: example-build
platforms: [hifi, ont]
native_catalog: ../examples/catalogs/strdust.bed
threads: 4
resources: { memory: 8 GB, time: 12h }
phased_reads_expected: false
additional_args: []
options:
  minlen: 1
  support: 3
  consensus_reads: 20
  max_number_reads: 60
  max_locus: 100000
  find_outliers: true
  phasing: ward
  haploid_chromosomes: []
