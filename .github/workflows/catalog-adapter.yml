name: Catalog adapter

on:
  push:
  pull_request:

jobs:
  catalog-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check bin/catalog_adapter.py tests/test_catalog_adapter.py
      - run: pytest -q tests/test_catalog_adapter.py
      - run: bash tests/test_catalog_adapter_docker.sh
